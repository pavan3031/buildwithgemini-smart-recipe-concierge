<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Recipe Concierge</title>
<!-- Google Fonts, Material Symbols, and Marked.js Markdown Parser -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
  :root {
    --accent: #10b981;
    --accent-hover: #059669;
    --accent-glow: rgba(16, 185, 129, 0.15);
    --gold: #f59e0b;
    --bg-dark: #090d16;
    --card-bg: #111827;
    --card-border: #1f2937;
    --text-main: #f9fafb;
    --text-muted: #9ca3af;
    --user-bubble: #065f46;
    --user-bubble-border: #047857;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--card-border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .logo-badge {
    background: linear-gradient(135deg, #10b981, #059669);
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
    box-shadow: 0 0 15px var(--accent-glow);
  }

  .header-text h1 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, #a7f3d0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .header-text p {
    margin: 2px 0 0 0;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    background: rgba(16, 185, 129, 0.1);
    color: #34d399;
    padding: 0.35rem 0.85rem;
    border-radius: 9999px;
    border: 1px solid rgba(16, 185, 129, 0.25);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    animation: fadeIn 0.25s ease-out;
  }

  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    display: inline-block;
    padding: 1rem 1.35rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    max-width: 90%;
    font-size: 0.95rem;
    line-height: 1.6;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--user-bubble-border);
    color: #ecfdf5;
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
    box-shadow: none;
  }

  /* Markdown Formatting in Agent Bubbles */
  .markdown-body {
    font-size: 0.95rem;
    line-height: 1.65;
    color: #f3f4f6;
  }

  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
    margin-top: 1rem;
    margin-bottom: 0.5rem;
    font-weight: 700;
    color: #a7f3d0;
  }

  .markdown-body h1 { font-size: 1.25rem; border-bottom: 1px solid var(--card-border); padding-bottom: 0.3rem; }
  .markdown-body h2 { font-size: 1.15rem; }
  .markdown-body h3 { font-size: 1.05rem; }

  .markdown-body p { margin: 0.5rem 0; }
  .markdown-body p:first-child { margin-top: 0; }
  .markdown-body p:last-child { margin-bottom: 0; }

  .markdown-body ul, .markdown-body ol {
    margin: 0.5rem 0;
    padding-left: 1.5rem;
  }

  .markdown-body li {
    margin-bottom: 0.35rem;
  }

  .markdown-body strong {
    color: #34d399;
    font-weight: 700;
  }

  .markdown-body code {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid #1f2937;
    padding: 0.15rem 0.4rem;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.88rem;
    color: #a7f3d0;
  }

  .markdown-body pre {
    background: #0b0f19;
    border: 1px solid var(--card-border);
    padding: 0.85rem;
    border-radius: 10px;
    overflow-x: auto;
    margin: 0.75rem 0;
  }

  .markdown-body pre code {
    background: transparent;
    border: none;
    padding: 0;
    color: #e5e7eb;
  }

  .markdown-body blockquote {
    border-left: 3px solid var(--accent);
    margin: 0.75rem 0;
    padding-left: 1rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .markdown-body table {
    width: 100%;
    border-collapse: collapse;
    margin: 0.75rem 0;
  }

  .markdown-body th, .markdown-body td {
    border: 1px solid var(--card-border);
    padding: 0.5rem 0.75rem;
    text-align: left;
  }

  .markdown-body th {
    background: #1f2937;
    color: #34d399;
  }

  /* Footer Controls & Quick Suggestions */
  .footer-container {
    background: rgba(17, 24, 39, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--card-border);
    padding: 1rem 1.5rem;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
  }

  .suggestions-row {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 0.85rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
  }

  .suggestion-pill {
    background: rgba(31, 41, 55, 0.7);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 0.45rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .suggestion-pill:hover {
    background: var(--accent-glow);
    color: #34d399;
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  form {
    display: flex;
    gap: 0.75rem;
  }

  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    background: #0f172a;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text-main);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  button {
    padding: 0.85rem 1.5rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  button:hover {
    background: linear-gradient(135deg, #059669, #047857);
    box-shadow: 0 0 15px var(--accent-glow);
    transform: translateY(-1px);
  }

  /* A2UI Component Styles (Card, Column, Row, Text, Image, Divider) */
  .a2card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 1.25rem;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    max-width: 100%;
    width: 100%;
  }

  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 800; color: #a7f3d0; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #f3f4f6; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #e5e7eb; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-muted); }

  .a2divider { border: none; border-top: 1px solid #1f2937; margin: 0.6rem 0; width: 100%; }
  
  .a2img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
    display: block;
    border: 1px solid #374151;
    margin-top: 0.5rem;
  }

  .material-symbols-outlined {
    font-size: 1.25rem;
    vertical-align: middle;
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <div class="header-title">
    <div class="logo-badge">🥗</div>
    <div class="header-text">
      <h1>Smart Recipe Concierge</h1>
      <p>AI Culinary Assistant & Digital Household Pantry</p>
    </div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    <span>Concierge Active</span>
  </div>
</header>

<div id="log"></div>

<div style="width: 100%; background: rgba(17, 24, 39, 0.95); border-top: 1px solid var(--card-border);">
  <div class="footer-container">
    <div class="suggestions-row">
      <button type="button" class="suggestion-pill" onclick="sendSuggestion('Inspect my digital pantry and list ingredients')">
        🥗 Search my digital pantry
      </button>
      <button type="button" class="suggestion-pill" onclick="sendSuggestion('Find an authentic Italian pasta recipe and show image')">
        🍝 Find Italian pasta recipe
      </button>
      <button type="button" class="suggestion-pill" onclick="sendSuggestion('Consult the herbal guide for a natural cough remedy')">
        🌿 Historical herbal remedy
      </button>
    </div>

    <form id="form">
      <input id="input" placeholder="Ask about recipes, pantry items, herbal remedies, or dish images..." autocomplete="off" autofocus>
      <button type="submit">
        <span>Send</span>
        <span class="material-symbols-outlined" style="font-size: 1.1rem; color: #fff;">send</span>
      </button>
    </form>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendSuggestion(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit'));
}

/* A2UI Mini-Renderer (v0.8 Basic Catalog subset) */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) {
    for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  }
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col");
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n));
      return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      const textVal = boundStr(props.text);
      if (window.marked && textVal.includes("\n")) {
        t.innerHTML = marked.parse(textVal);
      } else {
        t.textContent = textVal;
      }
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "";
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined");
      s.textContent = iconName(boundStr(props.name) || props.name);
      return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) {
      const spec = comps[id];
      childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c));
    }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) {
    const node = buildNode(rid, comps, new Set());
    if (node) { container.appendChild(node); drew = true; }
  }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) {
      for (const c of su.components) {
        if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
      }
    }
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    const mdDiv = el("div", "markdown-body");
    if (window.marked) {
      mdDiv.innerHTML = marked.parse(textStr);
    } else {
      mdDiv.textContent = textStr;
    }
    b.appendChild(mdDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) {
      const mdDiv = el("div", "markdown-body");
      const flat = flattenText(a2ui);
      if (window.marked && flat) mdDiv.innerHTML = marked.parse(flat);
      else mdDiv.textContent = flat || "(no card content)";
      b.appendChild(mdDiv);
    }
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  b.textContent = "… Thinking";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
